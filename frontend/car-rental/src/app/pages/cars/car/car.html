<div class="car-card card">
  <div class="image">
    <img [src]="car().imageUrl" [alt]="car().carName" />

    <div class="badge" [class.unavailable]="!car().available">
      {{ car().available ? "Available" : "Unavailable" }}
    </div>
  </div>

  <div class="content">
    <div class="top">
      <div class="name">{{ car().carName }}</div>
      <div class="price">${{ car().pricePerDay }}/day</div>
    </div>

    <div class="meta">
      <span>{{ car().model }}</span>
      <span>{{ car().transmissionType }}</span>
      <span>{{ car().seatsNumber }} seats</span>
    </div>

    <div class="type">
      {{ car().carType }}
    </div>

    <div class="actions">
      <button class="btn btn--primary" [disabled]="!car().available">
        Rent Now
      </button>

      <button (click)="goToDetails()" class="btn">Details</button>
    </div>
  </div>
</div>
