<div class="overlay">
  <div class="dialog">
    <div class="dialog-header">
      <h3 class="header-title">
        {{ 'Are you sure you want to remove this booking?' | translate }}
      </h3>
    </div>

    <div class="conformation-container">
      {{ 'if you proceed, this booking will be permanently deleted.' | translate }}
    </div>

    <div class="dialog-buttons">
      <button class="btn close-btn" (click)="closeDialog()">
        {{ 'common.cancel' | translate }}
      </button>
      <button class="btn save-btn" (click)="removeBooking()">
        {{ 'common.save' | translate }}
      </button>
    </div>
  </div>
</div>
