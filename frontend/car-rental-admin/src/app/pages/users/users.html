<section class="users">
  <div class="users-list">
    <div class="users__header">
      <div>
        <div class="chip">Clients</div>
        <h1 class="users__title">Users Management</h1>
      </div>
      <button class="btn btn--primary users__create" (click)="onCreateUser()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Add User
      </button>
    </div>
    <div class="filters">
      <div class="filter-group">
        <label class="filter-label"> User name </label>
        <div class="role-pills">
          <app-text-input
            [config]="{
              control: fullNameControl,
              placeholder: 'Search by name',
            }"
          ></app-text-input>
        </div>
      </div>
    </div>

    @if (isFetching() && !users().length) {
      <div class="loading">
        <span class="spinner"></span>
        Loading users...
      </div>
    } @else if (users().length) {
      <div class="users-cards">
        @for (user of users(); track user._id) {
          <app-user [user]="user"></app-user>
        }
      </div>

      @if (isFetching()) {
        <div class="load-more-spinner">
          <span class="spinner"></span>
        </div>
      }
    } @else {
      <div class="empty">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#d1d5db"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <p>No users found.</p>
        @if (hasActiveFilters) {
          <button class="clear-btn" (click)="clearFilters()">Clear filters</button>
        }
      </div>
    }
  </div>
</section>
